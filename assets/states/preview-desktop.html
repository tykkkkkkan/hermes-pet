<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>赫尔墨兹 · 桌面立体效果演示</title>
<style>
  :root{
    --pet: 440px;          /* 精灵画布显示尺寸，角色本身占高度 80% */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    color:#1b2330;overflow:hidden;
    background:#dde6f2;
  }

  /* ---------------- 假桌面壁纸 ---------------- */
  .wall{
    position:fixed;inset:0;
    background:
      radial-gradient(120% 90% at 18% 12%, #ffffff 0%, rgba(255,255,255,0) 45%),
      radial-gradient(100% 80% at 85% 90%, #9fb0c6 0%, rgba(159,176,198,0) 60%),
      linear-gradient(170deg,#eef3fa 0%,#dbe5f1 46%,#c3d0e0 100%);
    transition:filter .35s ease;
  }
  body.dark .wall{
    background:
      radial-gradient(120% 90% at 20% 10%, #2b3a55 0%, rgba(43,58,85,0) 50%),
      radial-gradient(90% 70% at 82% 88%, #101724 0%, rgba(16,23,36,0) 60%),
      linear-gradient(170deg,#1a2334 0%,#131b29 55%,#0b111b 100%);
  }
  body.dark{color:#e8eef8}

  /* ---------------- 布局 ---------------- */
  .bar{
    position:fixed;left:0;right:0;top:0;height:52px;z-index:20;
    display:flex;align-items:center;gap:10px;padding:0 18px;
    background:rgba(255,255,255,.55);backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(0,0,0,.06);
  }
  body.dark .bar{background:rgba(18,26,40,.6);border-bottom-color:rgba(255,255,255,.08)}
  .bar b{font-weight:600;margin-right:8px}
  .bar button{
    font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;cursor:pointer;
    border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.7);color:inherit;
  }
  body.dark .bar button{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.08)}
  .bar button[aria-pressed="true"]{background:#1f6b54;border-color:#1f6b54;color:#fff}
  .spacer{flex:1}

  .stage{
    position:fixed;inset:52px 0 34px 0;display:flex;justify-content:center;
    align-items:center;gap:clamp(40px,10vw,160px);padding-top:0;
  }
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .cell .label{
    font-size:12px;letter-spacing:.06em;opacity:.55;text-transform:uppercase;
  }
  .cell .label b{font-weight:600;letter-spacing:0;text-transform:none;opacity:.9}

  /* ---------------- 精灵本体 ---------------- */
  .pet{
    position:relative;
    width:var(--pet);height:var(--pet);
    transform-style:preserve-3d;
    transition:transform .18s ease-out;
  }
  .pet > *{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* 泛光：屏幕混合，压在最后面 */
  .halo{
    mix-blend-mode:screen;opacity:.55;
    animation:haloPulse 5.2s ease-in-out infinite;
  }
  /* 整体落影：随呼吸缩放、变淡 */
  .cast{
    transform-origin:50% 95%;
    animation:castBreathe 3.8s ease-in-out infinite;
  }
  /* 主体：外圈一点点上浮阴影，把人物从壁纸上托起来 */
  .body{
    filter:drop-shadow(0 5px 9px rgba(10,16,32,.26));
    transform-origin:50% 95%;
  }
  /* 呼吸：整体轻微上下拉伸，锚点锁在脚底 */
  .breathe{
    animation:breathe 3.8s ease-in-out infinite;
    transform-origin:50% 95%;
  }
  /* 玻璃高光扫过：用主图的 alpha 当遮罩，光只落在人物身上 */
  .gloss{
    background:linear-gradient(102deg,
      rgba(255,255,255,0) 34%,
      rgba(255,255,255,.85) 45%,
      rgba(255,255,255,.22) 52%,
      rgba(255,255,255,0) 63%);
    background-size:320% 100%;
    background-position:140% 0;
    mix-blend-mode:screen;
    -webkit-mask:url("body/idle.png") center/100% 100% no-repeat;
    mask:url("body/idle.png") center/100% 100% no-repeat;
    animation:sweep 7.5s cubic-bezier(.4,0,.2,1) infinite;
    pointer-events:none;
  }
  /* 贴地影：压在最上层，只在脚底 */
  .contact{
    transform-origin:50% 95%;
    animation:contactBreathe 3.8s ease-in-out infinite;
  }

  @keyframes breathe{
    0%,100%{transform:scale(1,1)}
    50%{transform:scale(1.006,1.016)}
  }
  @keyframes castBreathe{
    0%,100%{opacity:.92;transform:scale(1)}
    50%{opacity:.74;transform:scale(1.035)}
  }
  @keyframes contactBreathe{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.82;transform:scale(1.05)}
  }
  @keyframes haloPulse{
    0%,100%{opacity:.45;transform:scale(.98)}
    50%{opacity:.62;transform:scale(1.03)}
  }
  @keyframes sweep{
    0%{background-position:140% 0}
    62%{background-position:140% 0}
    100%{background-position:-60% 0}
  }

  /* 关掉动画的一组开关 */
  body.noAnim .halo,body.noAnim .cast,body.noAnim .breathe,
  body.noAnim .contact,body.noAnim .gloss{animation:none}
  body.noAnim .gloss{opacity:0}

  /* 平涂对照列：同尺寸，不加任何图层 */
  .flat .body{filter:none}

  .hint{
    position:fixed;left:0;right:0;bottom:0;padding:9px 18px;font-size:12px;
    background:rgba(255,255,255,.5);backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,.06);opacity:.8;
  }
  body.dark .hint{background:rgba(18,26,40,.55);border-top-color:rgba(255,255,255,.08)}
</style>
</head>
<body>

<div class="wall"></div>

<div class="bar">
  <b>赫尔墨兹 · 桌面效果</b>
  <button id="t1" aria-pressed="true">呼吸 / 落影</button>
  <button id="t2" aria-pressed="true">玻璃高光</button>
  <button id="t3" aria-pressed="true">光标视差</button>
  <span class="spacer"></span>
  <button id="t4" aria-pressed="false">深色壁纸</button>
</div>

<div class="stage">
  <div class="cell flat">
    <div class="pet" id="flatPet">
      <img class="body" src="body/idle.png" alt="">
    </div>
    <div class="label"><b>原图直接贴</b> · 无图层</div>
  </div>

  <div class="cell">
    <div class="pet" id="pet">
      <img class="halo"    src="fx/halo.png"    alt="">
      <img class="cast"    src="fx/shadow.png"  alt="">
      <img class="body breathe" src="body/idle.png" alt="赫尔墨兹">
      <div class="gloss"></div>
      <img class="contact" src="fx/contact.png" alt="">
    </div>
    <div class="label"><b>立体图层</b> · 泛光 + 落影 + 高光 + 贴地影</div>
  </div>
</div>

<div class="hint">鼠标在画面上移动可看视差；点上方按钮可逐项开关，对比每一层的作用。</div>

<script>
  const pet = document.getElementById('pet');
  const flatPet = document.getElementById('flatPet');

  document.getElementById('t1').onclick = (e) => {
    const on = e.currentTarget.getAttribute('aria-pressed') === 'true';
    e.currentTarget.setAttribute('aria-pressed', String(!on));
    document.body.classList.toggle('noAnim', on);
  };
  document.getElementById('t2').onclick = (e) => {
    const on = e.currentTarget.getAttribute('aria-pressed') === 'true';
    e.currentTarget.setAttribute('aria-pressed', String(!on));
    document.querySelectorAll('.gloss').forEach(g => g.style.display = on ? 'none' : 'block');
  };
  let parallaxOn = true;
  document.getElementById('t3').onclick = (e) => {
    parallaxOn = !parallaxOn;
    e.currentTarget.setAttribute('aria-pressed', String(parallaxOn));
    if (!parallaxOn) { pet.style.transform = ''; flatPet.style.transform = ''; }
  };
  document.getElementById('t4').onclick = (e) => {
    const on = e.currentTarget.getAttribute('aria-pressed') === 'true';
    e.currentTarget.setAttribute('aria-pressed', String(!on));
    document.body.classList.toggle('dark', !on);
  };

  // 光标视差：幅度很小，3~4 度，太多就假
  window.addEventListener('mousemove', (ev) => {
    if (!parallaxOn) return;
    const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    const dx = (ev.clientX - cx) / cx;   // -1..1
    const dy = (ev.clientY - cy) / cy;
    const t = `perspective(900px) rotateY(${(dx * 3.2).toFixed(2)}deg) rotateX(${(-dy * 2.2).toFixed(2)}deg) translateZ(0)`;
    pet.style.transform = t;
    flatPet.style.transform = t;
  });
</script>
</body>
</html>
