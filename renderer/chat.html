<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes 对话</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <header id="titlebar">
    <div>
      <div class="eyebrow">HERMES PRIVATE CHANNEL</div>
      <h1>Hermes <span id="connection-state">本地陪伴模式</span></h1>
    </div>
    <div class="window-actions">
      <button id="task-btn" title="拖文件或创建任务">任务</button>
      <button id="memory-btn" title="查看 Hermes 记忆">记忆</button>
      <button id="skills-btn" title="查看 Hermes 技能">技能</button>
      <button id="voice-btn" title="中文语音输入">听</button>
      <button id="speak-btn" title="停止语音朗读">读</button>
      <button id="settings-btn" title="设置">设置</button>
      <button id="hide-btn" title="隐藏窗口">—</button>
      <button id="close-btn" title="关闭窗口">×</button>
    </div>
  </header>

  <main>
    <section id="inspector" class="panel hidden">
      <div class="panel-head">
        <div>
          <h2 id="inspector-title">Hermes 数据</h2>
          <p id="inspector-hint">读取自 Hermes 本机目录</p>
        </div>
        <button id="inspector-close" class="quiet">收起</button>
      </div>
      <div id="inspector-content"></div>
    </section>
    <section id="setup" class="panel hidden">
      <div class="panel-head">
        <div>
          <h2>连接与人设</h2>
          <p>密钥只由主进程保存，聊天窗只拿到是否已配置的结果。</p>
        </div>
        <button id="setup-close" class="quiet">收起</button>
      </div>
      <div class="grid">
        <label>主人称呼<input id="user-name" maxlength="40" /></label>
        <label>桌宠名字<input id="pet-name" maxlength="40" /></label>
        <label class="wide">API 地址<input id="api-base" placeholder="https://api.deepseek.com/v1" /></label>
        <label>模型<input id="model" placeholder="deepseek-chat" /></label>
        <label>API Key<input id="api-key" type="password" placeholder="留空表示不修改" /></label>
        <label class="wide">专属人设<textarea id="persona" rows="4"></textarea></label>
      </div>
      <div class="setup-foot">
        <label class="check"><input id="clear-key" type="checkbox" /> 清除已保存密钥</label>
        <button id="save-settings" class="primary">保存设置</button>
      </div>
      <div id="setup-msg" class="hint"></div>
    </section>

    <section id="task-modal" class="panel hidden">
      <div class="panel-head">
        <div>
          <h2>派一个活给 Hermes</h2>
          <p id="task-files">拖进来的文件会作为任务附件上传</p>
        </div>
        <button id="task-cancel" class="quiet">取消</button>
      </div>
      <div class="grid">
        <label class="wide">任务标题<input id="task-title" maxlength="240" /></label>
        <label class="wide">要做什么<textarea id="task-body" rows="3" placeholder="写清楚目标和验收标准"></textarea></label>
        <label>执行人<select id="task-assignee"></select></label>
        <label>优先级<select id="task-priority"><option value="0">普通</option><option value="1">重要</option><option value="2">紧急</option></select></label>
      </div>
      <div class="setup-foot">
        <span id="task-msg" class="hint"></span>
        <button id="task-submit" class="primary">确认派发</button>
      </div>
    </section>

    <section id="chat" class="chat-shell">
      <div id="messages"></div>
      <div id="composer">
        <textarea id="input" rows="2" placeholder="和 Hermes 说点什么…"></textarea>
        <div class="composer-foot">
          <span id="mood">心情 -- · 好感 --</span>
          <button id="send" class="primary">发送</button>
        </div>
      </div>
    </section>
  </main>
  <script src="chat.js"></script>
</body>
</html>
