<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes 对话</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <header id="titlebar">
    <div class="brand">
      <img class="brand-avatar" src="../assets/ui/avatar.png" alt="" />
      <div class="brand-text">
        <h1>Hermes</h1>
        <p id="connection-state">正在连接…</p>
      </div>
    </div>

    <div class="title-tools">
      <span id="status-pill" class="status-pill" data-state="off">
        <i></i><span id="status-text">Hermes 离线</span>
      </span>

      <div class="window-actions">
        <button id="task-btn" class="icon-btn" title="派任务 · 可直接把文件拖进窗口" aria-label="派任务">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7"/><path d="M17 15v6M14 18h6"/></svg>
        </button>
        <button id="memory-btn" class="icon-btn" title="看 Hermes 的记忆" aria-label="记忆">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M8 7h7M8 11h7"/></svg>
        </button>
        <button id="skills-btn" class="icon-btn" title="看 Hermes 已装的技能" aria-label="技能">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg>
        </button>
        <button id="voice-btn" class="icon-btn" title="中文语音输入" aria-label="语音输入">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button id="speak-btn" class="icon-btn" title="停止朗读" aria-label="停止朗读">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M16 9.5 21 15M21 9.5 16 15"/></svg>
        </button>
        <button id="settings-btn" class="icon-btn" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M19.3 14.9a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1.03z"/></svg>
        </button>
        <span class="divider"></span>
        <button id="hide-btn" class="icon-btn window" title="收起来（桌宠还在）" aria-label="收起窗口">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button id="close-btn" class="icon-btn window danger" title="关闭对话窗" aria-label="关闭窗口">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div id="scrim" class="scrim hidden"></div>

    <section id="inspector" class="panel hidden">
      <div class="panel-head">
        <div>
          <h2 id="inspector-title">Hermes 数据</h2>
          <p id="inspector-hint">读取自 Hermes 本机目录</p>
        </div>
        <button id="inspector-close" class="quiet small">收起</button>
      </div>
      <div id="inspector-content" class="panel-scroll"></div>
    </section>

    <section id="setup" class="panel settings hidden">
      <div class="panel-head settings-head">
        <div>
          <h2>设置</h2>
          <p>外观与语音改动会立即生效，其余在保存后生效。</p>
        </div>
        <button id="setup-close" class="quiet small">关闭</button>
      </div>

      <div class="settings-body">
        <div class="sgroup">
          <h3>称呼</h3>
          <div class="grid tight">
            <label>主人称呼<input id="user-name" maxlength="40" /></label>
            <label>桌宠名字<input id="pet-name" maxlength="40" /></label>
          </div>
        </div>

        <div class="sgroup">
          <h3>外观</h3>
          <label class="slider-row">
            <span>桌宠大小</span>
            <input id="pet-scale" type="range" min="70" max="140" step="5" />
            <b id="pet-scale-val">100%</b>
          </label>
          <label class="slider-row">
            <span>不透明度</span>
            <input id="pet-opacity" type="range" min="40" max="100" step="5" />
            <b id="pet-opacity-val">100%</b>
          </label>
          <label class="select-row">主动台词
            <select id="line-frequency">
              <option value="quiet">安静，不主动开口</option>
              <option value="normal">正常</option>
              <option value="chatty">话多</option>
            </select>
          </label>
        </div>

        <div class="sgroup">
          <h3>语音</h3>
          <label class="switch-row">
            <span>语音播报<em>用系统离线语音，不消耗 API</em></span>
            <input id="voice-enabled" type="checkbox" class="toggle" />
          </label>
          <label class="select-row">音色
            <select id="voice-name"><option value="">自动（优先中文女声）</option></select>
          </label>
          <label class="slider-row">
            <span>语速</span>
            <input id="voice-rate" type="range" min="70" max="130" step="5" />
            <b id="voice-rate-val">100%</b>
          </label>
          <label class="slider-row">
            <span>音量</span>
            <input id="voice-volume" type="range" min="0" max="100" step="5" />
            <b id="voice-volume-val">85%</b>
          </label>
          <button id="voice-test" class="quiet small">试听一句</button>
        </div>

        <div class="sgroup">
          <h3>免打扰</h3>
          <label class="switch-row">
            <span>启用免打扰时段<em>时段内只静音，桌宠照常在场</em></span>
            <input id="dnd-enabled" type="checkbox" class="toggle" />
          </label>
          <div class="grid tight">
            <label>开始<input id="dnd-start" type="time" /></label>
            <label>结束<input id="dnd-end" type="time" /></label>
          </div>
          <label class="switch-row">
            <span>审批 / 需协助提醒仍出声</span>
            <input id="dnd-allow" type="checkbox" class="toggle" />
          </label>
        </div>

        <details class="sgroup">
          <summary><h3>连接与人设</h3></summary>
          <div class="grid tight">
            <label class="wide">API 地址<input id="api-base" placeholder="https://api.deepseek.com/v1" /></label>
            <label>模型<input id="model" placeholder="deepseek-chat" /></label>
            <label>API Key<input id="api-key" type="password" placeholder="留空表示不修改" /></label>
            <label class="wide">专属人设<textarea id="persona" rows="4"></textarea></label>
          </div>
          <div class="key-actions">
            <button id="import-key" class="quiet small">从 Hermes 导入密钥</button>
            <label class="check"><input id="clear-key" type="checkbox" /> 清除已保存密钥</label>
          </div>
        </details>
      </div>

      <div class="settings-foot">
        <button id="reset-settings" class="quiet">恢复默认</button>
        <span id="setup-msg" class="hint"></span>
        <button id="save-settings" class="primary">保存设置</button>
      </div>
    </section>

    <section id="task-modal" class="panel hidden">
      <div class="panel-head">
        <div>
          <h2>派一个活给 Hermes</h2>
          <p id="task-files">拖进来的文件会作为任务附件上传</p>
        </div>
        <button id="task-cancel" class="quiet small">取消</button>
      </div>
      <div class="panel-scroll">
        <div class="grid">
          <label class="wide">任务标题<input id="task-title" maxlength="240" /></label>
          <label class="wide">要做什么<textarea id="task-body" rows="3" placeholder="写清楚目标和验收标准"></textarea></label>
          <label>执行人<select id="task-assignee"></select></label>
          <label>优先级<select id="task-priority"><option value="0">普通</option><option value="1">重要</option><option value="2">紧急</option></select></label>
        </div>
      </div>
      <div class="setup-foot">
        <span id="task-msg" class="hint"></span>
        <button id="task-submit" class="primary">确认派发</button>
      </div>
    </section>

    <section id="chat" class="chat-shell">
      <div id="welcome" class="welcome">
        <div class="welcome-ring"><img src="../assets/ui/avatar.png" alt="" /></div>
        <h2>我是赫尔墨兹</h2>
        <p>守在桌面右下角。你派给 Hermes 的活我盯着进度，跑完了会来跟你说一声。</p>
        <div class="quick">
          <button data-ask="现在 Hermes 在跑什么？">现在在跑什么</button>
          <button data-ask="今天 Hermes 都做了什么？">今天做了什么</button>
          <button data-ask="帮我看一下我的记忆里有什么">看我的记忆</button>
          <button data-act="task">派个活给她</button>
        </div>
      </div>

      <div id="messages"></div>

      <div id="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="和 Hermes 说点什么…"></textarea>
          <button id="send" class="primary send-btn" aria-label="发送">
            <span>发送</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-7 16-2.4-6.5z"/></svg>
          </button>
        </div>
        <div class="composer-foot">
          <span id="mood" class="mood">心情 -- · 好感 --</span>
          <span class="keys">Enter 发送 · Shift+Enter 换行</span>
        </div>
      </div>
    </section>
  </main>
  <script src="local-asr.js"></script>
  <script src="chat.js"></script>
</body>
</html>
