<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Hermes 菜单</title>
  <link rel="stylesheet" href="menu.css" />
</head>
<body>
  <div id="menu">
    <div class="mi emphasis" data-act="chat">打开对话</div>
    <div class="mi" data-act="talk">说句话</div>
    <div class="mi" data-act="snap">回到右下角</div>
    <div class="sep"></div>
    <div class="mi" data-act="top">切换置顶</div>
    <div class="mi" data-act="autostart">开机自启（开关）</div>
    <div class="mi" data-act="settings">打开设置</div>
    <div class="sep"></div>
    <div class="mi" data-act="dir">打开 Hermes 目录</div>
    <div class="mi" data-act="hide">安静一会儿</div>
    <div class="mi danger" data-act="quit">退出</div>
  </div>
  <script src="menu.js"></script>
</body>
</html>
